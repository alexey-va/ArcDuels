# The example is disabled intentionally. Set real isolated coordinates and
# enable it before accepting production matches.
arenas:
  example:
    enabled: false
    # Optional per-arena compatibility. Omit for both modes.
    # Values: OWN_INVENTORY, KIT.
    allowed-loadouts: [OWN_INVENTORY, KIT]
    # Optional objective allowlist. A KOTH arena also requires a hill section.
    allowed-objectives: [ELIMINATION, KING_OF_THE_HILL, SUMO, BOXING, COMBO]
    first-spawn:
      world: world
      x: 0.5
      y: 80.0
      z: -10.5
      yaw: 0.0
      pitch: 0.0
    second-spawn:
      world: world
      x: 0.5
      y: 80.0
      z: 10.5
      yaw: 180.0
      pitch: 0.0
    # Safe post-match waiting point. Set it from the admin arena GUI or with
    # /duels admin arena setlobby <id>. The primary world spawn is the fallback.
    lobby:
      world: world
      x: 0.5
      y: 80.0
      z: 24.5
      yaw: 180.0
      pitch: 0.0
    bounds:
      min:
        x: -15.0
        y: 70.0
        z: -15.0
      max:
        x: 15.0
        y: 100.0
        z: 15.0
    # Required only for king-of-the-hill matches. Configure in game with
    # /duels admin arena sethill <id> [radius] [height].
    hill:
      center:
        world: world
        x: 0.5
        y: 80.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      radius: 3.5
      height: 3.0
