# Unique node id used in Redis event origin checks.
server-id: duels-1
challenge-timeout-seconds: 45
# Zero starts immediately after both players are safely prepared and teleported.
countdown-seconds: 0

player-data-sync:
  # AUTO detects HuskSync. Use HUSKSYNC or NONE to declare the node contract
  # explicitly. NONE nodes can host kit arenas but are not advertised for
  # cross-server own-inventory fights.
  provider: AUTO
  # After synchronized data is ready, wait before comparing the live inventory
  # with the origin snapshot. The snapshot is applied only when they differ.
  settle-delay-ticks: 40

post-match:
  # PROMPT leaves the player in the arena lobby and offers a safe return button.
  # AUTOMATIC keeps the legacy delayed proxy return.
  return-policy: PROMPT
  # If an arena has no explicit lobby, use this backend's primary world spawn.
  server-spawn-fallback: true

locale:
  # ru or en. When enabled, Russian Minecraft clients get ru and all others en.
  default: ru
  use-client-locale: true

celebration:
  fireworks:
    enabled: true
    # Bounded to 1..5 at runtime.
    count: 3

mysql:
  # Matches are fail-closed while this is false: ArcDuels requires a durable
  # snapshot of both players before teleporting or replacing an inventory.
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: common
  username: arcduels
  password: ''
  # DISABLED, REQUIRED, VERIFY_CA, or VERIFY_IDENTITY
  ssl-mode: VERIFY_IDENTITY
  inventory-snapshots:
    # Restored snapshots are archived for manual recovery and never auto-applied.
    retention-days: 7
    cleanup-interval-minutes: 60
  pool:
    minimum-idle: 1
    maximum-size: 8
    connection-timeout-ms: 10000
    socket-timeout-ms: 30000
    validation-timeout-ms: 5000
    max-lifetime-ms: 1700000

redis:
  enabled: false
  # RusCrafting nodes can reuse the already provisioned local ARC connection
  # without duplicating its password in this file.
  import-arc-credentials: false
  host: 127.0.0.1
  port: 6379
  username: ''
  password: ''
  broadcast-wins: true
  # ProxyARC publishes the authoritative network player snapshot once a second.
  player-list-origin: proxy
  player-list-ttl-seconds: 5
  # Accepted cross-server challenges are routed to a live compatible arena node.
  transfer-timeout-seconds: 30

# Stable semantic GUI roles. The bundled defaults work without a resource pack.
# A production overlay may add custom-model-data only together with its matching
# ItemsAdder base material.
gui:
  items:
    background:
      material: GRAY_STAINED_GLASS_PANE
    back:
      material: BLUE_STAINED_GLASS_PANE
    previous:
      material: ARROW
    next:
      material: SPECTRAL_ARROW
    info:
      material: CLOCK
    refresh:
      material: REPEATER
    confirm:
      material: LIME_CONCRETE

