# Unique node id used in Redis event origin checks.
server-id: duels-1
challenge-timeout-seconds: 45

locale:
  # ru or en. When enabled, Russian Minecraft clients get ru and all others en.
  default: ru
  use-client-locale: true

celebration:
  fireworks:
    enabled: true
    # Bounded to 1..5 at runtime.
    count: 3

mysql:
  # Matches are fail-closed while this is false: ArcDuels requires a durable
  # snapshot of both players before teleporting or replacing an inventory.
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: common
  username: arcduels
  password: ''
  # DISABLED, REQUIRED, VERIFY_CA, or VERIFY_IDENTITY
  ssl-mode: VERIFY_IDENTITY
  inventory-snapshots:
    # Restored snapshots are archived for manual recovery and never auto-applied.
    retention-days: 7
    cleanup-interval-minutes: 60
  pool:
    minimum-idle: 1
    maximum-size: 8
    connection-timeout-ms: 10000
    socket-timeout-ms: 30000
    validation-timeout-ms: 5000
    max-lifetime-ms: 1700000

redis:
  enabled: false
  # RusCrafting nodes can reuse the already provisioned local ARC connection
  # without duplicating its password in this file.
  import-arc-credentials: false
  host: 127.0.0.1
  port: 6379
  username: ''
  password: ''
  broadcast-wins: true
  # ProxyARC publishes the authoritative network player snapshot once a second.
  player-list-origin: proxy
  player-list-ttl-seconds: 5
  # Accepted cross-server challenges are routed to a live compatible arena node.
  transfer-timeout-seconds: 30

