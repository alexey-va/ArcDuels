# The example is disabled intentionally. Set real isolated coordinates and
# enable it before accepting production matches.
arenas:
  example:
    enabled: false
    first-spawn:
      world: world
      x: 0.5
      y: 80.0
      z: -10.5
      yaw: 0.0
      pitch: 0.0
    second-spawn:
      world: world
      x: 0.5
      y: 80.0
      z: 10.5
      yaw: 180.0
      pitch: 0.0
    bounds:
      min:
        x: -15.0
        y: 70.0
        z: -15.0
      max:
        x: 15.0
        y: 100.0
        z: 15.0
    # Required only for king-of-the-hill matches. Configure in game with
    # /duels admin arena sethill <id> [radius] [height].
    hill:
      center:
        world: world
        x: 0.5
        y: 80.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      radius: 3.5
      height: 3.0
