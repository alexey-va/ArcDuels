# Unique node id used in Redis event origin checks.
server-id: duels-1
# Technical ids above stay unchanged in Redis, storage, and proxy routing.
# These MiniMessage names are used only on player-facing surfaces.
server-display-names:
  duels-1: '<#ffb347>Арена</#ffb347>'
  spawn: '<#ffb347>Спавн</#ffb347>'
  survival: '<#55ff8a>Выживание</#55ff8a>'
  parkour: '<#32d6ff>Паркур</#32d6ff>'
challenge-timeout-seconds: 45

multiplayer:
  # Time available to accept a group invitation. Existing invitations retain
  # the deadline captured when their lobby was created.
  invitation-timeout-seconds: 45
  # Victory screen duration before every participant is safely restored.
  finish-delay-ticks: 60
  # Defaults are captured when a new group-match draft is opened.
  defaults:
    layout: FREE_FOR_ALL
    kit-policy: SHARED
    kit: classic

# Starts only after both players are safely prepared and teleported.
countdown-seconds: 3
# For a few ticks after an arena teleport, keep the server-authoritative spawn
# position and clear stale velocity. This absorbs late movement packets and
# avoids client/anticheat rubber-banding before the countdown begins.
teleport-stabilization-ticks: 3
rematch-window-seconds: 180
# Show a title before a player crosses a configured arena boundary.
boundary-warning-distance: 12.0

player-data-sync:
  # AUTO detects HuskSync. Use HUSKSYNC or NONE to declare the node contract
  # explicitly. NONE nodes can host kit arenas but are not advertised for
  # cross-server own-inventory fights.
  provider: AUTO
  # After synchronized data is ready, wait before comparing the live inventory
  # with the origin snapshot. The snapshot is applied only when they differ.
  settle-delay-ticks: 40

post-match:
  # PROMPT leaves the player in the arena lobby and offers a safe return button.
  # AUTOMATIC keeps the legacy delayed proxy return.
  return-policy: PROMPT
  # Maximum retry window for AUTOMATIC cross-server returns.
  automatic-return-timeout-seconds: 120

series:
  # Pause between completed rounds in BO3/BO5/etc. Existing matches retain it.
  round-intermission-ticks: 30

shutdown:
  # Wait briefly for already-applied snapshots to be archived before closing
  # storage. A timeout leaves the active snapshot retryable on next join.
  recovery-timeout-ms: 5000

locale:
  # ru or en. When enabled, Russian Minecraft clients get ru and all others en.
  default: ru
  use-client-locale: true

celebration:
  # Keep both players on the arena for the victory sequence before recovery.
  duration-ticks: 80
  fireworks:
    enabled: true
    # Bounded to 1..5 at runtime.
    count: 4

mysql:
  # Matches are fail-closed while this is false: ArcDuels requires a durable
  # snapshot of both players before teleporting or replacing an inventory.
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: common
  username: arcduels
  password: ''
  # DISABLED, REQUIRED, VERIFY_CA, or VERIFY_IDENTITY
  ssl-mode: VERIFY_IDENTITY
  inventory-snapshots:
    # Restored snapshots are archived for manual recovery and never auto-applied.
    retention-days: 7
    cleanup-interval-minutes: 60
  pool:
    minimum-idle: 1
    maximum-size: 8
    connection-timeout-ms: 10000
    socket-timeout-ms: 30000
    validation-timeout-ms: 5000
    max-lifetime-ms: 1700000

redis:
  enabled: false
  # RusCrafting nodes can reuse the already provisioned local ARC connection
  # without duplicating its password in this file.
  import-arc-credentials: false
  host: 127.0.0.1
  port: 6379
  username: ''
  password: ''
  broadcast-wins: true
  # ProxyARC publishes the authoritative network player snapshot once a second.
  player-list-origin: proxy
  player-list-ttl-seconds: 5
  # Accepted cross-server challenges are routed to a live compatible arena node.
  transfer-timeout-seconds: 30

# Stable semantic GUI roles. The bundled defaults work without a resource pack.
# A production overlay may add custom-model-data only together with its matching
# ItemsAdder base material.
gui:
  # Maximum time an administrator may keep the create-arena chat prompt open.
  arena-name-input-timeout-seconds: 60
  # Upper bounds for asynchronous menu queries. Changes affect the next render.
  leaderboard-limit: 100
  history-limit: 100
  items:
    background:
      material: GRAY_STAINED_GLASS_PANE
    back:
      material: BLUE_STAINED_GLASS_PANE
    previous:
      material: ARROW
    next:
      material: SPECTRAL_ARROW
    info:
      material: CLOCK
    refresh:
      material: REPEATER
    confirm:
      material: LIME_CONCRETE

# The example is disabled intentionally. Set real isolated coordinates and
# enable it before accepting production matches.
arenas:
  example:
    enabled: false
    # Plain player-facing name shown together with server-display-names.
    display-name: Example arena
    # Optional per-arena compatibility. Omit for both modes.
    # Values: OWN_INVENTORY, KIT.
    allowed-loadouts: [OWN_INVENTORY, KIT]
    # Optional objective allowlist. A KOTH arena also requires a hill section.
    allowed-objectives: [ELIMINATION, KING_OF_THE_HILL, SUMO, BOXING, COMBO]
    first-spawn:
      world: world
      x: 0.5
      y: 80.0
      z: -10.5
      yaw: 0.0
      pitch: 0.0
    second-spawn:
      world: world
      x: 0.5
      y: 80.0
      z: 10.5
      yaw: 180.0
      pitch: 0.0
    # Explicit safe slots for 3..12-player matches. `team-2` and `team-3`
    # describe which side receives this point in the corresponding layout.
    multiplayer-spawns:
      '1': {world: world, x: -8.5, y: 80.0, z: -12.5, yaw: 34.0, pitch: 0.0, team-2: 1, team-3: 1}
      '2': {world: world, x: -2.5, y: 80.0, z: -12.5, yaw: 11.0, pitch: 0.0, team-2: 1, team-3: 1}
      '3': {world: world, x: 3.5, y: 80.0, z: -12.5, yaw: -14.0, pitch: 0.0, team-2: 1, team-3: 1}
      '4': {world: world, x: 9.5, y: 80.0, z: -12.5, yaw: -37.0, pitch: 0.0, team-2: 1, team-3: 1}
      '5': {world: world, x: 12.5, y: 80.0, z: -5.5, yaw: -67.0, pitch: 0.0, team-2: 1, team-3: 2}
      '6': {world: world, x: 12.5, y: 80.0, z: 5.5, yaw: -113.0, pitch: 0.0, team-2: 1, team-3: 2}
      '7': {world: world, x: 9.5, y: 80.0, z: 12.5, yaw: -143.0, pitch: 0.0, team-2: 2, team-3: 2}
      '8': {world: world, x: 3.5, y: 80.0, z: 12.5, yaw: -166.0, pitch: 0.0, team-2: 2, team-3: 2}
      '9': {world: world, x: -2.5, y: 80.0, z: 12.5, yaw: 169.0, pitch: 0.0, team-2: 2, team-3: 3}
      '10': {world: world, x: -8.5, y: 80.0, z: 12.5, yaw: 146.0, pitch: 0.0, team-2: 2, team-3: 3}
      '11': {world: world, x: -12.5, y: 80.0, z: 5.5, yaw: 113.0, pitch: 0.0, team-2: 2, team-3: 3}
      '12': {world: world, x: -12.5, y: 80.0, z: -5.5, yaw: 67.0, pitch: 0.0, team-2: 2, team-3: 3}
    # Safe post-match waiting point. Set it from the admin arena GUI or with
    # /duels admin arena setlobby <id>. Without one, each player returns to
    # their assigned spawn on this arena.
    lobby:
      world: world
      x: 0.5
      y: 80.0
      z: 24.5
      yaw: 180.0
      pitch: 0.0
    # Optional per-arena override. LOCAL_LOBBY keeps recovered players here;
    # RETURN_TO_ORIGIN sends them back immediately after the finale.
    post-match-action: LOCAL_LOBBY
    bounds:
      min:
        x: -100.0
        y: -64.0
        z: -100.0
      max:
        x: 100.0
        y: 320.0
        z: 100.0
    # Required only for king-of-the-hill matches. Configure in game with
    # /duels admin arena sethill <id> [radius] [height].
    hill:
      center:
        world: world
        x: 0.5
        y: 80.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      radius: 3.5
      height: 3.0
