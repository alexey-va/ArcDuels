name: ArcDuels
version: '${version}'
main: ru.ruscrafting.duels.paper.ArcDuelsPlugin
api-version: '1.21'
description: Modern Kotlin duels for RusCrafting
author: RusCrafting
softdepend: [BattlePass, CMI, HuskSync, WorldGuard]
commands:
  duel:
    description: Open duels or manage a challenge
    usage: /duel [player|accept|deny|cancel|leave|return|stats|top|history|rematch|admin]
    aliases: [duels, дуэль]
    permission: arcduels.use
permissions:
  arcduels.use:
    description: Use duel commands and menus
    default: true
  arcduels.admin:
    description: Configure arenas and recover durable player state
    default: op
  arcduels.bypass:
    description: Bypass ArcDuels command restrictions while player state is locked
    default: op
